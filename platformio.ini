; Offline Pokédex for an ESP32-S3 with 16 MB flash and 8 MB octal PSRAM.
; Wiring, controls, and licenses are in README.md. Serial monitor: 115200.

[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 14680064
board_build.partitions = partitions.csv

extra_scripts =
    pre:tools/patch_tft.py
    pre:tools/prepare_dex.py

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bodmer/TJpg_Decoder@^1.1.0

board_build.embed_files = data/dex.bin

build_flags =
    -DBOARD_HAS_PSRAM
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=280
    -DTFT_INVERSION_ON=1
    -DTFT_BL=9
    -DTFT_CS=10
    -DTFT_MISO=21
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_DC=13
    -DTFT_RST=14
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=40000000
    -DTOUCH_CS=-1
    -DUSE_FSPI_PORT=1
